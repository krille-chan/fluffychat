version: 2
updates:
  - package-ecosystem: "pub"
    directory: "/"
    schedule:
      interval: "daily"
    allow:
      - dependency-name: "*"
    commit-message:
      prefix: "build: "
      include: "scope"
    assignees:
      - "krille-chan"
    open-pull-requests-limit: 5
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    allow:
      - dependency-name: "*"
    commit-message:
      prefix: "build: "
      include: "scope"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "build: "
      include: "scope"
    ignore:
      # Only update to Ubuntu LTS releases
      - dependency-name: "ubuntu"
        versions: ["24.10", "25.04", "25.10", "26.10", "27.04", "27.10"]
