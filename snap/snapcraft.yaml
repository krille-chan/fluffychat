name: fluffychat
title: FluffyChat Matrix Messenger
base: core24
version: 2.9.1
license: AGPL-3.0
summary: The cutest messenger in the Matrix network
description: |
  ## Your communication should be yours.

  The open-source, non-profit European alternative to big tech’s messaging and video-call monopoly. End-to-end encrypted, decentralized, and easy to use for everyone.

  ### Messaging how it should be

  Whether for your friends, your company or local community, FluffyChat supports a variety of features to cover all your daily needs.

  #### Easy to use

  Simply install, log in and start chatting. The intuitive user interface makes secure communication as easy as possible.

  #### Secure

  With olm/megolm end-to-end encryption, encrypted message backups and an automated key trust system, FluffyChat is among the most secure messengers available.

  #### Decentral

  Based on the open Matrix protocol we build a decentralized messaging network together, which no entity can control. Host your own chat server while remaining in contact with everyone.

  ### Feature rich and reliable

  From public chats with tens of thousands of participants and polls to custom stickers, spaces, rich moderation tools, and multi-device support, FluffyChat delivers a comprehensive communication suite.

  #### Secure video calls

  Direct calls and video conferences, fully secured with Matrix RTC-compatible encryption.

  #### Not another walled garden

  We do not build another walled garden! FluffyChat is fully compatible with any other Matrix client like Element, Nheko, Cinny or NeoChat. Learn more at matrix.org.

  #### Made by volunteers

  FluffyChat is a non-profit project based on open standards and driven entirely by volunteers. Infrastructure is funded by donations, and participation is open to everyone.

  Join the community: https://matrix.to/#/#fluffy-space:matrix.org
  Website: http://fluffychat.im
  Microblog: https://troet.cafe/@krille

grade: stable
confinement: strict

platforms:
  amd64:
    build-on: amd64
  arm64:
    build-on: arm64

parts:
  flutter-git:
    source: https://github.com/flutter/flutter.git
    source-tag: 3.47.2
    source-depth: 1
    plugin: nil
    override-build: |
      mkdir -p $CRAFT_PART_INSTALL/usr/bin
      mkdir -p $CRAFT_PART_INSTALL/usr/libexec
      cp -r $CRAFT_PART_SRC $CRAFT_PART_INSTALL/usr/libexec/flutter
      ln -s $CRAFT_PART_INSTALL/usr/libexec/flutter/bin/flutter $CRAFT_PART_INSTALL/usr/bin/flutter
      ln -s $SNAPCRAFT_PART_INSTALL/usr/libexec/flutter/bin/dart $SNAPCRAFT_PART_INSTALL/usr/bin/dart
      $CRAFT_PART_INSTALL/usr/bin/flutter doctor
    build-packages:
      - clang
      - cmake
      - curl
      - libgtk-3-dev
      - ninja-build
      - unzip
      - xz-utils
      - zip
      - lld
      - llvm-18
    override-prime: ''

  fluffychat:
    after: [flutter-git]
    plugin: nil
    source: .
    override-build: |
      # Install rust manually:
      curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      export PATH="$HOME/.cargo/bin:$PATH"

      # Workaround for Flutter build error:
      rm -rf build

      flutter build linux --release -v
      mkdir -p $CRAFT_PART_INSTALL/bin/
      cp -r build/linux/*/release/bundle/* $CRAFT_PART_INSTALL/bin/
    build-packages:
      - libsecret-1-dev
      - libjsoncpp-dev
      - libssl-dev
      - curl
      - libpciaccess-dev
      - libpulse-dev
    stage-packages:
      - libsecret-1-0
      - libjsoncpp25
      - libpciaccess0
      - libpulse0
      - libmpv2
      - libblas3
      - liblapack3
    override-prime: | # Workaround for MediaKit:
      craftctl default
      for library_dir in "$CRAFT_PRIME"/usr/lib/*-linux-gnu; do
        if [ -e "$library_dir/libmpv.so.2" ]; then
          ln -sf "$(basename "$library_dir")/libmpv.so.2" "$CRAFT_PRIME/usr/lib/libmpv.so.2"
        fi
        ln -sf blas/libblas.so.3 "$library_dir/libblas.so.3"
        ln -sf lapack/liblapack.so.3 "$library_dir/liblapack.so.3"
      done

slots:
  dbus-svc:
    interface: dbus
    bus: session
    name: chat.fluffy.fluffychat

apps:
  fluffychat:
    command: bin/fluffychat
    extensions: [ gnome ]
    plugs:
      - desktop
      - desktop-legacy
      - home
      - network
      - network-manager
      - opengl
      - removable-media
      - browser-support
      - password-manager-service
      - camera
      - audio-record
      - audio-playback
    slots:
      - dbus-svc
    environment:
      LIBMPV_LIBRARY_PATH: $SNAP/usr/lib/libmpv.so.2 # Otherwise app does not find libmp3
